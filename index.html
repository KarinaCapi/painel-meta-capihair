async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:IT,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(C));return new TextDecoder().decode(pt);}
async function go(pw,remember){const bt=document.getElementById("bt");bt.disabled=true;bt.textContent="Abrindo…";
try{const h=await open_(pw);try{if(remember)sessionStorage.setItem("capi_meta_pw",pw)}catch(e){}
document.open();document.write(h);document.close();}
catch(e){document.getElementById("er").textContent="Senha incorreta";bt.disabled=false;bt.textContent="Entrar";try{sessionStorage.removeItem("capi_meta_pw")}catch(_){}}}
document.getElementById("f").onsubmit=e=>{e.preventDefault();go(document.getElementById("pw").value,true);};
